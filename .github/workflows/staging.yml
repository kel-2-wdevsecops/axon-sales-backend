# Deploy ke staging (VPS 1 GB yang juga menjalankan Pterodactyl). Dipanggil
# release.yml (workflow_call) setelah build.yml, SEBELUM release-please:
# rilis dan deploy produksi hanya terjadi untuk commit yang sehat di staging.
#
# Seluruh kerja berat ada di runner GitHub, bukan di VPS:
#   1. Policy admission di runner: registry, format digest, tanda tangan
#      Cosign, dan provenance. Image ditarik VPS berdasarkan digest, dan digest
#      mengikat isi image, jadi verifikasi di runner sama kuatnya dengan
#      verifikasi di VPS tanpa memasang cosign/gh di mesin 1 GB itu.
#   2. SSH ke VPS dengan kunci yang dikunci ke satu perintah
#      (staging/axon-staging.sh lewat command= di authorized_keys). GITHUB_TOKEN
#      dikirim lewat stdin untuk menarik image; token itu mati saat job selesai,
#      jadi VPS tidak menyimpan kredensial registry apa pun.
#   3. axon-staging.sh: pull by digest, compose up, health check (image yang
#      jalan = digest ini, dan /api/v1/health "ok"), rollback otomatis.
#   4. Smoke test opsional dari internet lewat Cloudflare (vars.STAGING_URL).
#
# Konfigurasi di tingkat ORGANISASI, satu kali untuk repo BE dan FE:
# Organization -> Settings -> Secrets and variables -> Actions, dengan
# Repository access = Selected repositories (BE dan FE saja). Lihat
# staging/README.md.
#   secrets: STAGING_SSH_HOST, STAGING_SSH_KEY, STAGING_SSH_KNOWN_HOSTS
#   vars   : STAGING_SSH_USER (default deploy), STAGING_URL (opsional, mis.
#            https://staging.example.com)
# Jangan buat secret bernama sama di repo atau environment "staging": GitHub
# memakai yang paling dekat (environment > repo > organisasi), jadi salinan
# lama di sana diam-diam menimpa nilai organisasi.
# SSH memakai port 22. STAGING_SSH_HOST dan STAGING_SSH_KNOWN_HOSTS tidak
# sama: yang pertama alamat tujuan, yang kedua host key publik VPS untuk
# membuktikan bahwa alamat itu memang VPS kita (lihat step Siapkan SSH).
# Tanpa secret itu job ini GAGAL, bukan dilewati: staging adalah gerbang.

name: Deploy Staging

on:
  workflow_call:
    inputs:
      digest:
        description: Digest image hasil build.yml (sha256:...).
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/kel-2-wdevsecops/be
  SERVICE: be

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environment hanya dipakai sebagai pagar cabang (Deployment branches =
    # main), bukan tempat secret: secret organisasi tidak bisa dibatasi per
    # cabang, environment bisa. Secret-nya tetap dari organisasi.
    environment: staging
    permissions:
      contents: read
      packages: read # token yang dikirim ke VPS hanya bisa membaca package
    # Satu deploy staging per repo dalam satu waktu. Antar repo (BE dan FE)
    # diserialkan flock di axon-staging.sh.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      IMAGE_DIGEST: ${{ inputs.digest }}
      SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@refs/heads/main
    steps:
      - name: Policy admission - registry dan digest
        run: |
          case "$IMAGE_NAME" in ghcr.io/kel-2-wdevsecops/*) ;; *) echo "DITOLAK: registry tidak diizinkan."; exit 1 ;; esac
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "DITOLAK: digest image tidak valid atau kosong."
            exit 1
          fi

      - name: Login ke GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pasang Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Policy admission - tanda tangan dan provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify "$IMAGE_NAME@$IMAGE_DIGEST" \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" --repo "$GITHUB_REPOSITORY"

      # known_hosts dari secret, bukan ssh-keyscan atau StrictHostKeyChecking=no:
      # tanpa itu, siapa pun di tengah jalan bisa menyamar jadi VPS dan
      # menerima GITHUB_TOKEN. Isinya "<host> ssh-ed25519 AAAA...": host key
      # publik VPS, bukan alamatnya. Alamat saja tidak membuktikan apa pun
      # (DNS atau rute bisa dibajak); host key hanya cocok dengan VPS yang
      # memegang private key server-nya.
      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::Secret organisasi untuk staging belum lengkap atau repo ini belum diberi akses (STAGING_SSH_HOST, STAGING_SSH_KEY, STAGING_SSH_KNOWN_HOSTS). Lihat staging/README.md."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging ~/.ssh/known_hosts

      - name: Deploy ke VPS staging
        id: deploy
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ vars.STAGING_SSH_USER || 'deploy' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          printf '%s\n' "$GH_TOKEN" | ssh -i ~/.ssh/staging \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$SSH_USER@$SSH_HOST" deploy "$SERVICE" "$IMAGE_DIGEST"
          rc=$?
          case $rc in
            0) echo "result=success" >> "$GITHUB_OUTPUT" ;;
            3) echo "result=rolled-back" >> "$GITHUB_OUTPUT" ;;
            4) echo "result=rollback-failed" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=failed" >> "$GITHUB_OUTPUT" ;;
          esac
          exit $rc

      # Dari internet, lewat Cloudflare dan nginx FE, sama dengan jalur
      # pengguna. Dilewati kalau STAGING_URL kosong atau dilindungi Cloudflare
      # Access (yang menjawab 302 ke halaman login).
      - name: Smoke test lewat URL publik
        if: vars.STAGING_URL != ''
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          for _ in $(seq 1 12); do
            body=$(curl -fsS --max-time 10 "$STAGING_URL/api/v1/health") && echo "$body" | jq -e '.data.status == "ok"' && exit 0
            sleep 5
          done
          echo "::error::$STAGING_URL/api/v1/health tidak sehat."
          exit 1

      - name: Bersihkan kunci SSH
        if: always()
        run: rm -f ~/.ssh/staging

      - name: Notifikasi gagal
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESULT: ${{ steps.deploy.outputs.result }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "Secret NTFY_TOPIC belum diisi, notifikasi dilewati."; exit 0; fi
          case "$RESULT" in
            rolled-back)     msg="Staging BE GAGAL sehat, dikembalikan ke image sebelumnya. Rilis ditahan" ;;
            rollback-failed) msg="Staging BE GAGAL dan rollback juga gagal, VPS staging perlu dicek" ;;
            *)               msg="Staging BE GAGAL (verifikasi, SSH, atau smoke test). Rilis ditahan" ;;
          esac
          curl -fsS -d "$msg (commit $GITHUB_SHA)" "https://ntfy.sh/$NTFY_TOPIC" || true
