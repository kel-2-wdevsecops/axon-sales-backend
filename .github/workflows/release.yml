# Rilis & deploy. Satu-satunya jalan kode sampai ke staging dan produksi.
#
#   ci -> build -> staging -> release -> deploy
#
# Setiap push ke main:
# 1. ci       (ci.yml)      lint, test, typecheck, migrasi, SAST, secret scan, SCA.
# 2. build    (build.yml)   build image, scan, DAST, push :<sha>, sign, provenance.
# 3. staging  (staging.yml) image itu di-deploy ke VPS staging, health check,
#                           rollback otomatis bila tidak sehat.
# 4. release  release-please membaca pesan commit (Conventional Commits) sejak
#             rilis terakhir:
#    - Ada feat/fix/perf atau "!" yang belum dirilis -> bot membuka atau
#      memperbarui satu PR "chore(main): release x.y.z" berisi CHANGELOG.md dan
#      kenaikan "version" di package.json. Belum ada yang ke produksi.
#    - PR rilis itu di-merge -> push merge-nya melewati 1-3 juga, lalu bot
#      membuat tag vx.y.z + GitHub Release.
#    - Hanya refactor/ci/docs/chore/... -> tidak ada rilis.
# 5. deploy   (deploy.yml)  hanya kalau langkah 4 membuat rilis: digest yang
#             SAMA dengan yang lolos staging diberi tag :x.y.z dan :latest,
#             lalu di-deploy ke server produksi. Tidak ada build ulang.
#
# Setiap langkah adalah gerbang untuk langkah berikutnya: tag dan GitHub
# Release hanya dibuat untuk commit yang lulus CI DAN sehat di staging. Kalau
# gagal tepat saat PR rilis di-merge, PR itu tetap berlabel "autorelease:
# pending" dan release-please membuat rilisnya di push berikutnya yang lulus
# (deploy.yml lalu menolak promosi karena tag dan image berbeda commit; lihat
# komentarnya).
#
# Deploy dipanggil dari workflow ini, bukan dari "on: release" di deploy.yml:
# rilis yang dibuat dengan GITHUB_TOKEN tidak memicu workflow lain.
#
# Konfigurasi: release-please-config.json ("bootstrap-sha" = commit terakhir
# sebelum release-please dipasang; riwayat sebelumnya tidak dibaca) dan
# .release-please-manifest.json (versi terakhir yang dirilis; diperbarui bot,
# jangan diedit manual, begitu juga "version" di package.json).
#
# Butuh Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests" menyala, supaya bot boleh membuka PR rilis, dan
# environment "staging" berisi kredensial SSH VPS (staging/README.md).

name: Release

on:
  push:
    branches: [main]

# Dua push beruntun tidak boleh menjalankan dua rilis/deploy bersamaan; yang
# kedua menunggu. Push yang lebih baru tetap aman: release-please menghitung
# ulang semuanya dari riwayat, jadi rilis yang tertunda tidak hilang.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # Reusable workflow hanya bisa memakai permission yang diberikan di sini.
    permissions:
      contents: read
      packages: write
      id-token: write     # OIDC untuk Cosign keyless dan attestation
      attestations: write # menyimpan attestation provenance
    uses: ./.github/workflows/build.yml
    secrets:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

  staging:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/staging.yml
    with:
      digest: ${{ needs.build.outputs.digest }}
    # Secret environment "staging" (kunci SSH) dibaca job di staging.yml
    # sendiri; inherit untuk NTFY_TOPIC dan kalau kredensialnya disimpan
    # sebagai secret repo.
    secrets: inherit

  release-please:
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  deploy:
    needs: [build, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write # menambah tag :x.y.z dan :latest
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
    secrets:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
