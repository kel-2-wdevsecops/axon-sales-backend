# Build image, scan, DAST, push, sign. Dipanggil release.yml (workflow_call)
# di SETIAP push ke main, setelah CI lulus. Image yang dihasilkan dipakai dua
# kali tanpa di-build ulang: diuji di staging (staging.yml), lalu digest yang
# sama dipromosikan ke produksi (deploy.yml) kalau push itu menghasilkan rilis.
# Yang lolos staging itulah yang sampai ke produksi, byte demi byte.
#
# Registry: GHCR (ghcr.io) -- private package gratis tanpa batas jumlah,
# autentikasi memakai GITHUB_TOKEN bawaan Actions, tidak perlu secret tambahan.
# Build lokal di laptop tetap bebas memakai Podman, image yang dihasilkan
# tetap OCI-compliant sehingga tidak ada masalah kompatibilitas dengan Docker.
#
# Alur: build -> scan image (Trivy) -> DAST (ZAP baseline) -> push dengan
# SBOM + provenance -> sign (Cosign keyless) -> attestation (SLSA). Image yang
# gagal scan tidak pernah sampai ke registry.
#
# Tag di registry: hanya :<sha commit>. Tag :x.y.z dan :latest ditambahkan
# deploy.yml saat promosi ke produksi, menunjuk digest yang sama.
#
# Identitas tanda tangan Cosign adalah file ini (build.yml@refs/heads/main);
# staging.yml dan deploy.yml hanya memercayai identitas itu.

name: Build Image

on:
  workflow_call:
    outputs:
      digest:
        description: Digest image yang di-push (sha256:...).
        value: ${{ jobs.build.outputs.digest }}
      version:
        description: Versi di package.json commit ini.
        value: ${{ jobs.build.outputs.version }}
    secrets:
      NTFY_TOPIC:
        required: false

env:
  # GHCR mewajibkan nama image huruf kecil semua.
  IMAGE_NAME: ghcr.io/kel-2-wdevsecops/be
  APP_PORT: 3008

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Database untuk DAST: aplikasi keluar saat start kalau DB tidak
    # tersambung. Tabelnya dibuat dari migrasi baseline (tanpa data).
    services:
      mariadb:
        image: mariadb:11.8@sha256:93fc3fe333b6cdfb061425869c2c3a5bb2851c0c74dbebc2c940f024e7482d76
        env:
          MARIADB_ROOT_PASSWORD: dast
          MARIADB_DATABASE: dast
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    permissions:
      contents: read
      packages: write
      id-token: write     # identitas OIDC untuk Cosign keyless dan attestation
      attestations: write # menyimpan attestation provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Commit push ini (github.sha), bukan tag rilis: image dibuat sebelum
      # rilisnya ada. Pada push merge PR rilis, commit ini sudah berisi bump
      # versi, jadi image melaporkan versi rilis yang benar.
      - name: Checkout kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baca versi package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login ke GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build sekali ke daemon lokal untuk di-scan dan diuji. Belum ada yang
      # di-push: image yang gagal scan tidak boleh sampai ke registry.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: be:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Laporan lengkap (HIGH + CRITICAL yang sudah ada perbaikannya), tidak
      # memblokir.
      - name: Scan image (laporan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: be:scan
          version: v0.75.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      # Gerbang: CRITICAL yang sudah punya perbaikan menggagalkan build.
      # Biasanya cukup dengan menaikkan versi base image di Dockerfile.
      - name: Scan image (gerbang CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: be:scan
          version: v0.75.0
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      # Container produksi tidak menjalankan migrasi, jadi tabel classicmodels
      # (kosong) dibuat di sini dari migrasi baseline, memakai client dari
      # image MariaDB yang sama dengan service-nya. Tanpa tabel, endpoint
      # dashboard hanya menjawab 500 dan DAST tidak menguji apa pun.
      - name: Buat tabel untuk DAST
        run: |
          docker run --rm -i --network host \
            mariadb:11.8@sha256:93fc3fe333b6cdfb061425869c2c3a5bb2851c0c74dbebc2c940f024e7482d76 \
            mariadb -h 127.0.0.1 -u root -pdast dast < prisma/migrations/0_init/migration.sql

      # --network host: container menjangkau MariaDB service di
      # 127.0.0.1:3306, dan ZAP menjangkau aplikasi di localhost. Seluruh API
      # publik dan hanya-baca, jadi ZAP menjangkau semua endpoint-nya.
      - name: Jalankan container untuk DAST
        run: |
          docker run -d --name app --network host \
            -e PORT="$APP_PORT" \
            -e DATABASE_URL="mysql://root:dast@127.0.0.1:3306/dast" \
            be:scan
          for _ in $(seq 1 30); do
            curl -fs "http://localhost:$APP_PORT/api/v1/health" && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - name: DAST (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:${{ env.APP_PORT }}
          allow_issue_writing: false
          fail_action: false # ubah ke true setelah temuan awal dibereskan
          artifact_name: zap-report

      - name: Hentikan container DAST
        if: always()
        run: docker rm -f app || true

      # Build ulang dari cache (tidak ada layer yang dikompilasi ulang), lalu
      # push dengan SBOM dan provenance. Label versi dipakai job deploy untuk
      # tahu versi yang sedang jalan, sebagai target rollback.
      - name: Push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Pasang Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image dengan Cosign (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_NAME@$DIGEST"

      - name: Buat attestation provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Notifikasi gagal
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "Secret NTFY_TOPIC belum diisi, notifikasi dilewati."; exit 0; fi
          curl -fsS -d "Build image BE GAGAL di build/scan/sign, staging dan produksi tidak tersentuh (commit $GITHUB_SHA)" "https://ntfy.sh/$NTFY_TOPIC" || true
